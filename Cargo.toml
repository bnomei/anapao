[package]
name = "anapao"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
rust-version = "1.85"
description = "Library for deterministic simulation tests and reproducible stochastic workflows"
readme = "README.md"
homepage = "https://github.com/bnomei/anapao"
repository = "https://github.com/bnomei/anapao"
documentation = "https://docs.rs/anapao"
keywords = ["testing", "simulation", "deterministic", "stochastic", "monte-carlo"]
categories = ["development-tools", "development-tools::testing"]
exclude = [".DS_Store", "specs/**", "scripts/package-release.*"]

[features]
default = []
parallel = ["dep:rayon"]
analysis-polars = ["dep:polars"]
assertions-extended = ["dep:approx", "dep:assert-json-diff", "dep:insta", "dep:proptest"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
thiserror = "2.0.18"
itoa = "1.0.18"
ryu = "1.0.23"
memchr = "2.8.2"
smallvec = "1.15.2"
rand = "0.10.1"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
rayon = { version = "1.12.0", optional = true }
polars = { version = "0.54.4", optional = true, default-features = false, features = ["fmt", "lazy"] }
approx = { version = "0.5.1", optional = true }
assert-json-diff = { version = "2.0.2", optional = true }
insta = { version = "1.48.0", optional = true }
proptest = { version = "1.11.0", optional = true }

[dev-dependencies]
criterion = { version = "4.7.0", package = "codspeed-criterion-compat" }
rstest = "0.26.1"
tempfile = "3.27.0"

[[bench]]
name = "simulation"
harness = false
